name: Supabase Keepalive

# A Supabase ingyenes csomagban 7 nap inaktivitas utan automatikusan
# szunetelteti a projektet. Ez a workflow 3 naponta egy konnyu GET
# kerest kuld a REST API-ra, hogy a projekt mindig aktivnak szamitson.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 15 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          echo "HTTP status: $status"
          if [ "$status" -ge 500 ]; then
            echo "A Supabase REST API hibas statuszt adott vissza."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
